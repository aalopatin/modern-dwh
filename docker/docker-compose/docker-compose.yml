name: mdwh

x-sensor-defaults: &sensor-defaults
  image: mdwh/sensor-scala:latest
  depends_on:
    kafka:
      condition: service_healthy
    schema-registry:
      condition: service_healthy
  environment:
    KAFKA_TOPIC: sensors
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    KAFKA_SCHEMA_REGISTRY_URL: http://schema-registry:8081
  volumes:
    - ./volumes/files/sensors/application.conf:/application.conf
    - ./volumes/data/sensors/checkpoints:/checkpoints
  networks:
    - mdwh-network
services:
  kafka:
    image: apache/kafka:latest
    container_name: mdwh-kafka
    ports:
      - "19092:19092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT_HOST://0.0.0.0:19092,CONTROLLER://localhost:9093,PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT_HOST://localhost:19092,PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 5
      KAFKA_LOG_DIRS: /opt/kafka/data
      KAFKA_METADATA_LOG_DIR: /opt/kafka/meta
    healthcheck:
      test: ["CMD", "bash", "-c", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s
    stop_grace_period: 180s
    volumes:
      - ./volumes/data/kafka/data:/opt/kafka/data
      - ./volumes/data/kafka/meta:/opt/kafka/meta  
    networks:
      - mdwh-network
  schema-registry:
    image: confluentinc/cp-schema-registry:latest
    container_name: mdwh-schema-registry
    ports:
      - "8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - mdwh-network      
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: mdwh-kafka-ui
    ports:
      - "8088:8080"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
      kafka-connect:
        condition: service_started
    environment:
      DYNAMIC_CONFIG_ENABLED: 'true'
      KAFKA_CLUSTERS_0_NAME: kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: kafka-connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://kafka-connect:8083     
    networks:
      - mdwh-network
  sensor-th0101:
    <<: *sensor-defaults
    container_name: mdwh-sensor-TH0101
    command: TH0101
  sensor-t0102:
    <<: *sensor-defaults
    container_name: mdwh-sensor-T0102
    command: T0102
  sensor-h0102:
    <<: *sensor-defaults
    container_name: mdwh-sensor-H0102
    command: H0102
  kafka-connect:
    container_name: mdwh-kafka-connect
    image: mdwh/kafka-connect:latest
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      CONNECT_BOOTSTRAP_SERVERS: kafka:9092
      CONNECT_PLUGIN_PATH: "/opt/kafka/plugins,/opt/kafka/custom-plugins"      
    volumes:
      - ./volumes/data/kafka-connect/data:/tmp/kafka-connect/data
      - ./volumes/files/kafka-connect/custom-plugins:/opt/kafka/custom-plugins
    networks:
      - mdwh-network
  minio:
    image: minio/minio:latest
    container_name: mdwh-minio
    ports:
      - "9001:9001"
      - "9000:9000"
    command: ["server", "--console-address", ":9001", "/data"]
    volumes:
      - ./volumes/data/minio/data:/data
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    networks:
      - mdwh-network
  nessie:
    image: ghcr.io/projectnessie/nessie:latest
    container_name: mdwh-nessie
    ports:
      - "19120:19120"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NESSIE_VERSION_STORE_TYPE: JDBC2
      NESSIE_VERSION_STORE_PERSIST_JDBC_DATASOURCE: postgresql
      QUARKUS_DATASOURCE_POSTGRESQL_JDBC_URL: jdbc:postgresql://postgres:5432/nessie
      QUARKUS_DATASOURCE_POSTGRESQL_USERNAME: postgres
      QUARKUS_DATASOURCE_POSTGRESQL_PASSWORD: postgres
      QUARKUS_HTTP_PORT: 19120
      QUARKUS_LOG_LEVEL: DEBUG
    networks:
      - mdwh-network
  postgres:
    image: postgres
    container_name: mdwh-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: nessie
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    command: [ "postgres", "-c", "wal_level=logical" ]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nessie"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./volumes/data/postgres/data:/var/lib/postgresql/data
    networks:
      - mdwh-network
  jupyter:
    image: mdwh/jupyter:latest
    container_name: mdwh-jupyter
    ports:
      - "4040:4040"
      - "8888:8888"      
    volumes:
      - ./volumes/files/jupyter/workspace:/workspace
    networks:
      - mdwh-network
networks:
  mdwh-network:
    name: mdwh-network